    <rect width="132" height="34" rx="4" fill="#180030" stroke="#00f0ff" stroke-width="1.2"/>
    <rect x="10" y="12" width="10" height="10" fill="#ff2e97"/>
    <rect x="30" y="12" width="76" height="10" rx="3" fill="#00f0ff" opacity="0.7"/>

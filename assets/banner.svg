<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="ridayz - UI/UX Mockup Designer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070b"/>
      <stop offset="45%" stop-color="#150e28"/>
      <stop offset="75%" stop-color="#1d1235"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.28" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.82" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#a78bfa" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#dots)"/>
  <rect width="1280" height="340" fill="url(#glow1)"/>
  <rect width="1280" height="340" fill="url(#glow2)"/>

  <g stroke="#a78bfa" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="60" x2="1280" y2="60"/><line x1="0" y1="150" x2="1280" y2="150"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="330" x2="1280" y2="330"/>
  </g>

  <!-- decorative orbs -->
  <circle cx="1120" cy="70" r="42" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="1120" cy="70" r="6" fill="#22d3ee" fill-opacity="0.6"/>
  <circle cx="640" cy="300" r="70" fill="url(#glow2)"/>

  <!-- floating UI mockup card (right) -->
  <g transform="translate(830,52)">
    <rect width="380" height="216" rx="16" fill="#12121a" fill-opacity="0.92" stroke="#3b2f55" stroke-width="1.2"/>
    <rect x="1" y="1" width="378" height="36" rx="15" fill="#1a1a24"/>
    <circle cx="22" cy="19" r="5" fill="#ef4444"/><circle cx="40" cy="19" r="5" fill="#f59e0b"/><circle cx="58" cy="19" r="5" fill="#22c55e"/>
    <rect x="140" y="12" width="110" height="12" rx="6" fill="#2a2a38"/>
    <!-- sidebar -->
    <rect x="14" y="50" width="86" height="152" rx="10" fill="#171722"/>
    <rect x="24" y="62" width="66" height="9" rx="4" fill="url(#accent)" opacity="0.85"/>
    <rect x="24" y="82" width="52" height="7" rx="3" fill="#3f3f52"/>
    <rect x="24" y="98" width="60" height="7" rx="3" fill="#3f3f52"/>
    <rect x="24" y="114" width="44" height="7" rx="3" fill="#3f3f52"/>
    <rect x="24" y="130" width="56" height="7" rx="3" fill="#3f3f52"/>
    <!-- stat cards -->
    <rect x="112" y="50" width="118" height="62" rx="10" fill="#1c1630" stroke="#4c3a72"/>
    <rect x="124" y="62" width="46" height="8" rx="4" fill="#a78bfa" opacity="0.9"/>
    <rect x="124" y="80" width="72" height="14" rx="5" fill="url(#accent2)" opacity="0.75"/>
    <rect x="242" y="50" width="118" height="62" rx="10" fill="#1c1630" stroke="#4c3a72"/>
    <rect x="254" y="62" width="40" height="8" rx="4" fill="#22d3ee" opacity="0.8"/>
    <rect x="254" y="80" width="64" height="14" rx="5" fill="#22d3ee" opacity="0.45"/>
    <!-- chart area -->
    <rect x="112" y="124" width="248" height="78" rx="10" fill="#14141e" stroke="#2f2f42"/>
    <rect x="126" y="152" width="18" height="34" rx="4" fill="#8b5cf6" opacity="0.75"/>
    <rect x="152" y="140" width="18" height="46" rx="4" fill="#a78bfa" opacity="0.75"/>
    <rect x="178" y="160" width="18" height="26" rx="4" fill="#8b5cf6" opacity="0.6"/>
    <rect x="204" y="134" width="18" height="52" rx="4" fill="#22d3ee" opacity="0.7"/>
    <rect x="230" y="148" width="18" height="38" rx="4" fill="#a78bfa" opacity="0.65"/>
    <rect x="256" y="138" width="18" height="48" rx="4" fill="#8b5cf6" opacity="0.7"/>
    <rect x="282" y="156" width="18" height="30" rx="4" fill="#22d3ee" opacity="0.55"/>
    <rect x="308" y="144" width="18" height="42" rx="4" fill="#a78bfa" opacity="0.6"/>
  </g>

  <!-- small floating chip -->
  <g transform="translate(770,246)">
    <rect width="120" height="34" rx="17" fill="#1c1630" stroke="#4c3a72"/>
    <circle cx="24" cy="17" r="7" fill="url(#accent)"/>
    <rect x="40" y="12" width="60" height="9" rx="4" fill="#a78bfa" opacity="0.75"/>
  </g>

  <!-- left text -->
  <text x="72" y="128" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#ffffff">ridayz</text>
  <text x="72" y="172" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="url(#accent)">UI/UX Mockup Designer</text>
  <text x="74" y="208" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#b4b4c4">Wireframe &#183; Prototype &#183; Dashboard UI &#183; Design System</text>
  <rect x="74" y="230" width="72" height="4" rx="2" fill="url(#accent)"/>
  <text x="74" y="264" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8b8b9e">Turning ideas into interfaces you can see, click, and test.</text>
</svg>

    <linearGradient id="neon1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2e97"/>
      <stop offset="55%" stop-color="#b026ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="neon2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff2e97"/>
    </linearGradient>
    <radialGradient id="glowM" cx="0.22" cy="0.3" r="0.5">

      <rect x="164" y="146" width="20" height="54" rx="4" fill="#b026ff" opacity="0.8"/>
      <rect x="194" y="172" width="20" height="28" rx="4" fill="#ff2e97" opacity="0.6"/>
      <rect x="224" y="138" width="20" height="62" rx="4" fill="#00f0ff" opacity="0.85"/>
      <rect x="254" y="156" width="20" height="44" rx="4" fill="#b026ff" opacity="0.7"/>
      <rect x="284" y="148" width="20" height="52" rx="4" fill="#ff2e97" opacity="0.75"/>
      <rect x="314" y="168" width="20" height="32" rx="4" fill="#00f0ff" opacity="0.65"/>
      <rect x="344" y="152" width="20" height="48" rx="4" fill="#b026ff" opacity="0.7"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="ridayz - UI/UX Mockup Designer - Cyberpunk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">

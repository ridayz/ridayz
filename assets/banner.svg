    <rect x="130" y="80" width="80" height="16" rx="5" fill="url(#neon2)" opacity="0.7"/>
    <rect x="258" y="50" width="128" height="66" rx="8" fill="#180030" stroke="#00f0ff" stroke-opacity="0.45"/>
    <rect x="270" y="62" width="46" height="8" rx="4" fill="#ff2e97" opacity="0.85"/>
    <rect x="270" y="80" width="70" height="16" rx="5" fill="#b026ff" opacity="0.55"/>

    <rect x="262" y="232" width="6" height="6"/><rect x="300" y="182" width="6" height="6"/>
    <rect x="316" y="212" width="6" height="6"/><rect x="390" y="198" width="6" height="6"/>
    <rect x="404" y="228" width="6" height="6"/><rect x="430" y="242" width="6" height="6"/>
    <rect x="446" y="258" width="6" height="6"/><rect x="524" y="178" width="6" height="6"/>
    <rect x="540" y="204" width="6" height="6"/><rect x="524" y="238" width="6" height="6"/>

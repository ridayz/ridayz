<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ridayz - Mockup Designer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="55%" stop-color="#140f24"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <g stroke="#8b5cf6" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
  </g>

  <g transform="translate(860,60)" opacity="0.95">
    <rect width="360" height="200" rx="14" fill="#171717" stroke="#2a2a2a"/>
    <rect x="0" y="0" width="360" height="34" rx="14" fill="#1f1f1f"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/><circle cx="38" cy="17" r="5" fill="#f59e0b"/><circle cx="56" cy="17" r="5" fill="#22c55e"/>
    <rect x="18" y="52" width="120" height="12" rx="6" fill="url(#accent)" opacity="0.9"/>
    <rect x="18" y="76" width="200" height="9" rx="4" fill="#3f3f46"/>
    <rect x="18" y="94" width="160" height="9" rx="4" fill="#3f3f46"/>
    <rect x="18" y="122" width="100" height="58" rx="10" fill="#221c33" stroke="#3b2f55"/>
    <rect x="130" y="122" width="100" height="58" rx="10" fill="#221c33" stroke="#3b2f55"/>
    <rect x="242" y="122" width="100" height="58" rx="10" fill="#221c33" stroke="#3b2f55"/>
  </g>

  <text x="70" y="120" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#ffffff">ridayz</text>
  <text x="70" y="162" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="url(#accent)">Mockup Designer</text>
  <text x="70" y="200" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#a1a1aa">UI/UX wireframe &amp; dashboard mockup.</text>
  <rect x="70" y="224" width="60" height="4" rx="2" fill="url(#accent)"/>
